# Source: ks-core/templates/extension-museum.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extensions-museum
  namespace: kubesphere-system
  labels:
    app: extensions-museum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extensions-museum
  template:
    metadata:
      labels:
        app: extensions-museum
    spec:
      containers:
        - name: extensions-museum
          image: docker.io/kubesphere/ks-extensions-museum:latest
          command:
            - "/chartmuseum"
            - "--storage-local-rootdir"
            - "/charts"
            - "--storage"
            - "local"
            - "--tls-cert"
            - "/etc/certs/tls.crt"
            - "--tls-key"
            - "/etc/certs/tls.key"
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: certs
              mountPath: /etc/certs/
      volumes:
        - name: certs
          secret:
            secretName: extensions-museum-certs
